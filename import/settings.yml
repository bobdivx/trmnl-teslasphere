---
name: TeslaSphere
description: "Tesla via TeslaSphere"
strategy: polling
polling_url: https://teslasphere.app/api/trmnl/vehicle{% if vin %}?vin={{ vin }}{% endif %}
polling_headers: authorization=Bearer {{ oauth_access_token }}
polling_verb: get
refresh_interval: 15
framework_version: latest
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_body: ''
oauth_enabled: 'true'
oauth_authorize_url: https://teslasphere.app/api/trmnl/oauth/authorize
oauth_token_url: https://teslasphere.app/api/trmnl/oauth/token
oauth_scopes: vehicle:read
oauth_pkce_enabled: 'true'
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  category: analytics,travel
  description: 'Connect your TeslaSphere account. Charge data comes from your already-linked Tesla. Source: <a class="underline inline" href="https://github.com/bobdivx/trmnl-teslasphere" target="_blank">GitHub</a>.'
  github_url: https://github.com/bobdivx/trmnl-teslasphere
  email_address: Mathieu
- keyname: vin
  name: VIN (optional)
  field_type: string
  description: 'Leave empty to use your first TeslaSphere vehicle. Optional override.'
  optional: true
  placeholder: 5YJ3E1EA1KF000000
